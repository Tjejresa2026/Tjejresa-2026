<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f83">
<link rel="manifest" href="manifest.webmanifest">
<title>Tjejresan 2026</title>
<style>
:root{--teal:#087f83;--teal2:#2ab1a4;--deep:#075568;--mint:#dff3ee;--cream:#fffdf8;--ink:#17383b;--muted:#6d8586;--gold:#d8b45c;--line:rgba(7,85,104,.12);--shadow:0 16px 40px rgba(5,77,83,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{background:linear-gradient(160deg,#ccefeb,#edf8f5 45%,#dceff2);}
button{font:inherit;cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:10;padding:18px 18px 12px;background:rgba(7,93,104,.94);color:#fff;backdrop-filter:blur(12px);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.topline{display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:.14em;text-transform:uppercase;font-size:12px;opacity:.86;font-weight:800}
h1{font-family:Georgia,serif;font-size:29px;font-weight:500;margin:4px 0 0}main{padding:12px 17px 112px}
.card{background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.8);border-radius:25px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}
.hero{color:#fff;background:linear-gradient(145deg,#087f83,#16a69c 65%,#7dc9b3);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-85px;top:-80px;background:rgba(255,255,255,.1)}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--teal)}.hero .kicker{color:#dffbf5}
.big{font-family:Georgia,serif;font-size:31px;line-height:1.08;margin:8px 0 12px}.hero p{color:rgba(255,255,255,.93)}.muted{color:var(--muted)}
.btn{border:0;border-radius:999px;padding:12px 17px;background:var(--gold);color:#244243;font-weight:800}.btn.alt{background:var(--mint);color:var(--deep)}.btn.dark{background:var(--deep);color:white}.row{display:flex;gap:9px;flex-wrap:wrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.time{font-weight:900;font-size:20px}.meta{color:var(--muted);font-size:14px;margin-top:4px}.nowIcon{font-size:44px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{background:#f7fbfa;border:1px solid var(--line);border-radius:18px;padding:15px}.tile b{display:block;font-size:17px;margin-bottom:4px}
.quizOpt{width:100%;text-align:left;border:1px solid var(--line);background:white;padding:15px;border-radius:16px;margin:6px 0;color:var(--ink);font-weight:650}
.quizOpt:hover{border-color:var(--teal2);background:#f0faf7}.progress{height:7px;background:#d7e8e6;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:99px}
.timeline .item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.timeline .item:last-child{border-bottom:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--teal);margin:7px 0 0 3px;flex:none}
.item strong{font-size:14px}.item .title{font-weight:800}.small{font-size:12px}.notice{background:#fff8e7;border:1px solid #efdfb8;border-radius:17px;padding:14px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.navin{width:min(730px,100%);margin:auto;display:flex;gap:5px}.nav button{flex:1;border:0;background:transparent;border-radius:14px;padding:8px 3px;color:#718586;font-size:11px}.nav button.active{background:#e1f2ee;color:var(--teal);font-weight:900}
.admin{background:linear-gradient(145deg,#164b58,#087f83);color:#fff}.admin .kicker{color:#c9eee8}footer{text-align:center;color:#6c8586;font-size:11px;margin:25px 0}
.hidden{display:none!important}.count{font-size:25px;font-weight:900;letter-spacing:.02em}.lock{font-size:48px}
@media(max-width:500px){.card{padding:17px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topline"><div><div class="brand">Tjejresan · 2026</div><h1 id="title">Den hemliga resan</h1></div><div>♡</div></div></header>
<main id="main"></main>
<nav class="nav"><div class="navin">
<button id="home" onclick="go('home')">🏠<br>Hem</button>
<button id="now" onclick="go('now')">✨<br>Nu</button>
<button id="quiz" onclick="go('quiz')">❔<br>Quiz</button>
<button id="info" onclick="go('info')">ⓘ<br>Info</button>
<button id="admin" onclick="adminLogin()">🔐<br>Arrangör</button>
</div></nav>
</div>
<script>
const schedule=[
{date:"2026-09-10",start:"03:00",end:"04:30",icon:"🚕",title:"Taxi till Kastrup",place:"Hbg → Kastrup",detail:"Peter taxi · två taxibilar beställda"},
{date:"2026-09-10",start:"06:30",end:"12:26",icon:"✈️",title:"Flyg",place:"CPH → Luqa",detail:"Swiss Air",mask:{place:"CPH → resmålet"}},
{date:"2026-09-10",start:"12:26",end:"13:00",icon:"🚐",title:"Ankomst Malta + transfer till hotellet",place:"Malta flygplats → Plaza Regency, Sliema",detail:"Förbokad privat transfer",mask:{title:"Ankomst + transfer till hotellet",place:"Flygplatsen → hotellet"}},
{date:"2026-09-10",start:"13:00",end:"14:00",icon:"🏨",title:"Check-in + paus",place:"Plaza Regency Hotels",detail:"—",mask:{place:"Hotellet"}},
{date:"2026-09-10",start:"14:00",end:"15:00",icon:"🥂",title:"Lunch och bubbel",place:"Sliema",detail:"Hotellet",mask:{place:"Vid hotellet"}},
{date:"2026-09-10",start:"17:30",end:"18:00",icon:"⛴️",title:"Färja till Valletta",place:"Sliema → Valletta",detail:"Färja eller taxi",mask:{title:"Färja till stan",place:"Hotellet → stan"}},
{date:"2026-09-10",start:"18:00",end:"21:00",icon:"🍹",title:"Aperitivo",place:"Valletta",detail:"Bord för 10 · ett glas + något litet att äta",mask:{place:"I stan"}},
{date:"2026-09-10",start:"21:45",end:"23:15",icon:"🍽️",title:"Middag",place:"Valletta",detail:"Bord för 10 · Marie?",mask:{place:"I stan"}},
{date:"2026-09-10",start:"23:15",end:"23:59",icon:"🚕",title:"Till hotellet",place:"Valletta → Sliema",detail:"Färja/taxi",mask:{place:"Stan → hotellet"}},
{date:"2026-09-11",start:"08:00",end:"09:30",icon:"☕",title:"Frukost",place:"Hotellet",detail:"Ingår på hotellet"},
{date:"2026-09-11",start:"09:30",end:"10:30",icon:"🚶‍♀️",title:"Promenad till Katamaranen",place:"Hotellet → Triq Ix-Xatt, Tas-Sliema",detail:"Promenad",mask:{title:"Promenad till hamnen",place:"Hotellet → hamnen"}},
{date:"2026-09-11",start:"10:30",end:"18:30",icon:"🛥️",title:"Katamaran",place:"Triq Ix-Xatt, Tas-Sliema",detail:"Comino · Blue Lagoon · lunch · öppen bar",mask:{place:"Hamnen",detail:"Heldagstur på havet med lunch och öppen bar"}},
{date:"2026-09-11",start:"18:30",end:"19:00",icon:"🚶‍♀️",title:"Till hotellet",place:"Sliema",detail:"Promenad · ca 25 min",mask:{place:"Hotellet"}},
{date:"2026-09-11",start:"19:00",end:"19:30",icon:"🧘‍♀️",title:"Fri tid / dusch / vila",place:"Hotellet",detail:"Viktigt efter båtdagen"},
{date:"2026-09-11",start:"20:00",end:"21:30",icon:"🍽️",title:"Middag",place:"Valletta/Sliema",detail:"Bord för 10 · Marie?",mask:{place:"I stan/vid hotellet"}},
{date:"2026-09-11",start:"21:30",end:"23:00",icon:"🍸",title:"Drink",place:"Valletta/Sliema",detail:"Valfritt",mask:{place:"I stan/vid hotellet"}},
{date:"2026-09-12",start:"08:30",end:"10:00",icon:"☕",title:"Frukost",place:"Hotellet",detail:"Ingår på hotellet"},
{date:"2026-09-12",start:"10:00",end:"11:00",icon:"🚐",title:"Privat minibuss + chaufför",place:"Sliema → Mdina",detail:"Heldagspris bör begäras",mask:{place:"Hotellet → utflyktsmål"}},
{date:"2026-09-12",start:"11:00",end:"13:00",icon:"🏛️",title:"Utforska Mdina och ev lätt lunch",place:"Mdina",detail:"Bord för 10",mask:{title:"Utforska en historisk stad + ev lätt lunch",place:"Utflyktsmål"}},
{date:"2026-09-12",start:"13:00",end:"15:00",icon:"🍷",title:"Vingårdsbesök + provning",place:"Meridiana Wine Estate",detail:"Gruppbokning · allergier meddelas",mask:{place:"Vingård"}},
{date:"2026-09-12",start:"15:00",end:"16:00",icon:"🚐",title:"Tillbaka till hotellet",place:"Mdina → Sliema",detail:"Samma minibuss",mask:{place:"Utflyktsmål → hotellet"}},
{date:"2026-09-12",start:"16:00",end:"18:15",icon:"✨",title:"Fri tid + göra sig fin",place:"Hotellet",detail:"Sista kvällen"},
{date:"2026-09-12",start:"18:30",end:"19:00",icon:"⛴️",title:"Färd till Valletta",place:"Sliema → Valletta",detail:"Färja eller taxi",mask:{title:"Färd till stan",place:"Hotellet → stan"}},
{date:"2026-09-12",start:"19:00",end:"22:00",icon:"🥂",title:"Festmiddag",place:"Valletta",detail:"Bord för 10 · Marie?",mask:{place:"I stan"}},
{date:"2026-09-12",start:"22:00",end:"23:15",icon:"🍸",title:"Sista kvällens drink",place:"Valletta",detail:"Valfritt",mask:{place:"I stan"}},
{date:"2026-09-12",start:"23:15",end:"23:59",icon:"🚕",title:"Till hotellet",place:"Valletta → Sliema",detail:"Färja/taxi",mask:{place:"Stan → hotellet"}},
{date:"2026-09-13",start:"08:30",end:"10:00",icon:"🥐",title:"Lång frukost",place:"Hotellet",detail:"Ingår på hotellet"},
{date:"2026-09-13",start:"10:30",end:"11:00",icon:"🚐",title:"Transfer till flygplats",place:"Sliema → Malta flygplats",detail:"Förbokad privat transfer",mask:{place:"Hotellet → flygplatsen"}},
{date:"2026-09-13",start:"11:00",end:"12:30",icon:"🍴",title:"Check in och lunch på flygplatsen",place:"Malta flygplats",detail:"Anpassas efter flygtid",mask:{place:"Flygplatsen"}},
{date:"2026-09-13",start:"13:15",end:"19:10",icon:"✈️",title:"Flyg Luqa → CPH",place:"Malta flygplats → CPH flygplats",detail:"Swiss Air",mask:{title:"Flyg hem",place:"Flygplatsen → CPH"}},
{date:"2026-09-13",start:"19:45",end:"20:46",icon:"🚆",title:"Öresundståg",place:"Kastrup → Helsingborg C",detail:"Tåg"}
];
const quiz=[{"kicker": "Ledtråd 1", "q": "Vårt resmål ligger mitt i Medelhavet.", "opts": ["Italien", "Spanien", "Malta", "Cypern"], "answer": 2}, {"kicker": "Ledtråd 2", "q": "Här är engelska ett av de officiella språken.", "opts": ["Portugal", "Malta", "Grekland", "Kroatien"], "answer": 1}, {"kicker": "Ledtråd 3", "q": "En av världens äldsta befästa städer finns med i vår resa.", "opts": ["Mdina", "Nice", "Palermo", "Split"], "answer": 0}, {"kicker": "Ledtråd 4", "q": "En av resans dagar innehåller Blue Lagoon och katamaran.", "opts": ["Sardinien", "Malta", "Rhodos", "Kreta"], "answer": 1}, {"kicker": "Ledtråd 5", "q": "Nu är det dags att gissa hela resmålet!", "opts": ["Malta", "Madeira", "Cypern", "Sicilien"], "answer": 0}];
let revealed=localStorage.getItem('revealed')==='yes';
let admin=localStorage.getItem('admin')==='yes';
let demo=localStorage.getItem('demo')==='yes';
let demoIndex=Number(localStorage.getItem('demoIndex')||0);
let quizStep=Number(localStorage.getItem('quizStep')||0);
let currentPage='home';

// --- Quiz-lås: quizet öppnar först när resan börjar (eller i arrangörens demoläge) ---
const QUIZ_OPEN = new Date("2026-09-10T03:00:00+02:00").getTime();
function quizIsOpen(){ return demo || Date.now() >= QUIZ_OPEN; }
function fmtCountdown(ms){
 if(ms<=0) return '00:00:00';
 const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
 return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function setNav(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active')}
function go(p){currentPage=p;if(p==='home')home();if(p==='now')now();if(p==='quiz')quizPage();if(p==='info')info();if(p==='admin')adminPage()}
function home(){
 setNav('home');document.getElementById('title').textContent=revealed?'Malta 2026':'Den hemliga resan';
 document.getElementById('main').innerHTML=revealed
 ? `<section class="card hero"><div class="kicker">10–13 september · 10 tjejer</div><div class="big">🇲🇹 Malta!</div><p>Nu börjar äventyret. Låt appen hålla reda på tiderna så att ni kan njuta.</p><button class="btn" onclick="go('now')">Vad händer nu? →</button></section><section class="card"><div class="kicker">Snabbt till</div><div class="grid"><div class="tile"><b>✨ Just nu</b><span class="small muted">Aktuell aktivitet</span></div><div class="tile"><b>🗺️ Karta</b><span class="small muted">Aktuell plats</span></div><div class="tile"><b>📸 Foton</b><span class="small muted">Gemensamt album</span></div><div class="tile"><b>💌 Överraskning</b><span class="small muted">Marie & arrangörerna</span></div></div></section>`
 : `<section class="card hero"><div class="kicker">10–13 september · 10 tjejer</div><div class="big">Vart är vi på väg?</div><p>Destinationen är hemlig. På väg till Kastrup får ni ledtrådar och ska tillsammans gissa resmålet.</p><button class="btn" onclick="go('quiz')">Starta gissningsquizet →</button></section><section class="card"><div class="lock">🔒</div><div class="big">Allt avslöjas i rätt ögonblick.</div><p class="muted">De åtta gästerna ser bara den aktivitet som är aktuell. Nästa aktivitet är dold.</p></section>`;
 footer();
}
function getCurrent(){
 if(demo) return schedule[demoIndex];
 const now=new Date();
 const ts=now.getTime();
 const active=schedule.find(a=>ts>=new Date(a.date+'T'+a.start+':00+02:00').getTime() && ts<new Date(a.date+'T'+a.end+':00+02:00').getTime());
 if(active) return active;
 const next=schedule.find(a=>ts<new Date(a.date+'T'+a.start+':00+02:00').getTime());
 return next||schedule[schedule.length-1];
}
function displayFields(a){
 if(revealed||!a.mask) return {title:a.title,place:a.place,detail:a.detail};
 return {title:a.mask.title||a.title,place:a.mask.place||a.place,detail:a.mask.detail||a.detail};
}
function now(){
 setNav('now');document.getElementById('title').textContent='Just nu';
 const a=getCurrent();
 const d=displayFields(a);
 let isActive=true;
 if(!demo){
  const n=Date.now(), st=new Date(a.date+'T'+a.start+':00+02:00').getTime(), en=new Date(a.date+'T'+a.end+':00+02:00').getTime();
  isActive=n>=st&&n<en;
 }
 const mapBtn=revealed?'<button class="btn" onclick="maps()">📍 Visa vägen</button>':'<button class="btn" disabled title="Kartan visas efter avslöjandet">📍 Visa vägen</button>';
 document.getElementById('main').innerHTML=`<section class="card hero"><div class="nowIcon">${a.icon}</div><div class="kicker">${isActive?'Pågår nu':'Nästa aktivitet'}</div><div class="big">${esc(d.title)}</div><div class="time">⏰ ${a.start}–${a.end}</div><div class="meta" style="color:#e0f7f3">📍 ${esc(d.place)}</div><p>${esc(d.detail)}</p><div class="row">${mapBtn}<button class="btn alt" onclick="alert('Här lägger vi in boknings- eller biljettlänken.')">🎟️ Bokning</button></div></section><section class="card"><div class="kicker">Överraskningen</div><div class="big">🔒 Nästa aktivitet är dold</div><p class="muted">När klockan når nästa starttid byts innehållet automatiskt.</p></section>${demo?'<section class="card"><div class="kicker">Arrangörstest</div><button class="btn dark" onclick="nextDemo()">⏭️ Nästa aktivitet</button></section>':''}`;footer();
}
function maps(){
 if(!revealed) return; // säkerhetsspärr: ingen karta innan avslöjandet
 const a=getCurrent(); window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.place+' Malta'),'_blank');
}
function quizPage(){
 setNav('quiz');document.getElementById('title').textContent='Gissa resmålet';
 if(revealed){document.getElementById('main').innerHTML='<section class="card hero"><div class="kicker">Quiz klart</div><div class="big">🎉 Ni gissade rätt!</div><p>🇲🇹 Vi ska till Malta!</p><button class="btn" onclick="go(\'home\')">Till resan →</button></section>';footer();return}
 if(!quizIsOpen()){
  document.getElementById('main').innerHTML='<section class="card"><div class="lock">🔒</div><div class="kicker">Quizet är låst</div><div class="big">Öppnar kl. 03:00 den 10 september</div><p class="muted">När taxin kör igång låses ledtrådarna upp!</p><div class="count" id="countdown">'+fmtCountdown(QUIZ_OPEN-Date.now())+'</div></section>';
  footer();return;
 }
 const q=quiz[Math.min(quizStep,quiz.length-1)];
 document.getElementById('main').innerHTML='<section class="card"><div class="kicker">'+q.kicker+'</div><div class="progress"><span style="width:'+((quizStep+1)/quiz.length*100)+'%"></span></div><div class="big">'+q.q+'</div>'+q.opts.map((o,i)=>'<button class="quizOpt" onclick="answer('+i+')">'+esc(o)+'</button>').join('')+'</section><section class="card notice">💡 Tänk Medelhav, historia, hav och lite brittiska influenser.</section>';footer();
}
function answer(i){const q=quiz[Math.min(quizStep,quiz.length-1)];if(i===q.answer){quizStep++;localStorage.setItem('quizStep',quizStep);if(quizStep>=quiz.length){revealed=true;localStorage.setItem('revealed','yes');alert('🇲🇹 MALTA! Destinationen är avslöjad!')}}else alert('Inte riktigt… försök igen! 😉');go('quiz')}
function info(){
 setNav('info');document.getElementById('title').textContent='Praktiskt';
 const flygInfo=revealed?'Swiss Air · CPH ↔ Malta':'Avslöjas i quizet 🤫';
 const hotellInfo=revealed?'Plaza Regency · Sliema':'Avslöjas i quizet 🤫';
 document.getElementById('main').innerHTML='<section class="card"><div class="kicker">Resan</div><div class="grid"><div class="tile"><b>✈️ Flyg</b><span class="small muted">'+flygInfo+'</span></div><div class="tile"><b>🏨 Hotell</b><span class="small muted">'+hotellInfo+'</span></div><div class="tile"><b>👯 Grupp</b><span class="small muted">10 tjejer · 2 arrangörer</span></div><div class="tile"><b>📸 Foton</b><span class="small muted">Gemensamt album</span></div></div></section><section class="card"><div class="kicker">Praktiska länkar</div><p class="muted">Här lägger vi in packlista, telefonnummer, bokningsbekräftelser och albumlänk i den slutliga versionen.</p><div class="row"><button class="btn alt" onclick="alert(\'Packlista kommer här.\')">🧳 Packlista</button><button class="btn alt" onclick="alert(\'Viktiga nummer kommer här.\')">☎️ Viktiga nummer</button></div></section>';footer();
}
function adminLogin(){if(admin){go('admin');return}const p=prompt('Arrangörslösenord');if(p==='Malta2026!'){admin=true;localStorage.setItem('admin','yes');go('admin')}else alert('Fel lösenord.')}
function adminPage(){
 setNav('admin');document.getElementById('title').textContent='Arrangörsläge';
 const list=schedule.map((a,i)=>'<div class="item"><div class="dot"></div><div><strong>'+a.date+' · '+a.start+'–'+a.end+'</strong><div class="title">'+a.icon+' '+esc(a.title)+'</div><div class="small muted">📍 '+esc(a.place)+' · '+esc(a.detail)+'</div></div></div>').join('');
 document.getElementById('main').innerHTML='<section class="card admin"><div class="kicker">🔐 Endast arrangörer</div><div class="big">Hela resan</div><p>Du och Marie ser hela programmet.</p><div class="row"><button class="btn" onclick="reveal()">🔓 Avslöja Malta</button><button class="btn alt" onclick="demo=true;localStorage.setItem(\'demo\',\'yes\');go(\'now\')">🧪 Testa tidsflödet</button><button class="btn alt" onclick="admin=false;localStorage.removeItem(\'admin\');go(\'home\')">Logga ut</button></div></section><section class="card"><div class="kicker">Program</div><div class="timeline">'+list+'</div></section><section class="card notice"><b>Viktig nästa byggdel:</b> koppla gemensam databas för att kunna ändra tider/länkar från arrangörsmobilen och få ändringarna direkt hos alla åtta gäster.</section>';footer();
}
function reveal(){revealed=true;localStorage.setItem('revealed','yes');alert('🇲🇹 Malta är nu avslöjat!');go('home')}
function nextDemo(){demoIndex=(demoIndex+1)%schedule.length;localStorage.setItem('demoIndex',demoIndex);go('now')}
function footer(){document.getElementById('main').insertAdjacentHTML('beforeend','<footer>Tjejresan 2026'+(revealed?' · Malta 💚':' · 💚')+'</footer>')}

home();

// "Nu"-sidan uppdaterar sig själv var 30:e sekund
setInterval(()=>{ if(currentPage==='now') now(); },30000);
// Nedräkningen på quiz-låset uppdateras varje sekund, och låser upp automatiskt kl 03:00
setInterval(()=>{
 if(currentPage==='quiz' && !revealed){
  if(!quizIsOpen()){
   const el=document.getElementById('countdown');
   if(el) el.textContent=fmtCountdown(QUIZ_OPEN-Date.now());
   if(quizIsOpen()) quizPage(); // precis blivit 03:00 → visa quizet direkt
  }
 }
},1000);
</script>
</body></html>
