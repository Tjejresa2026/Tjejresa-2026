body{background:linear-gradient(160deg,#ccefeb,#edf8f5 45%,#dceff2);}
button,input,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:10;padding:18px 18px 12px;background:rgba(7,93,104,.94);color:#fff;backdrop-filter:blur(12px);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.topline{display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:.14em;text-transform:uppercase;font-size:12px;opacity:.86;font-weight:800}
h1{font-family:Georgia,serif;font-size:29px;font-weight:500;margin:4px 0 0}main{padding:12px 17px 112px}

.hero-img{width:100%;height:180px;object-fit:cover;border-radius:18px;margin-bottom:12px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--teal)}.hero .kicker{color:#dffbf5}
.big{font-family:Georgia,serif;font-size:31px;line-height:1.08;margin:8px 0 12px}.hero p{color:rgba(255,255,255,.93)}.muted{color:var(--muted)}
.btn{border:0;border-radius:999px;padding:12px 17px;background:var(--gold);color:#244243;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.alt{background:var(--mint);color:var(--deep)}.btn.dark{background:var(--deep);color:white}.btn.sm{padding:6px 12px;font-size:12px}.row{display:flex;gap:9px;flex-wrap:wrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.time{font-weight:900;font-size:20px}.meta{color:var(--muted);font-size:14px;margin-top:4px}.nowIcon{font-size:44px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{background:#f7fbfa;border:1px solid var(--line);border-radius:18px;padding:15px}.tile b{display:block;font-size:17px;margin-bottom:4px}
.quizOpt{width:100%;text-align:left;border:1px solid var(--line);background:white;padding:14px 16px;border-radius:16px;margin:6px 0;color:var(--ink);font-weight:650;cursor:pointer;transition:all 0.15s ease}
.quizOpt:hover{border-color:var(--teal2);background:#f0faf7}
.progress{height:8px;background:#d7e8e6;border-radius:999px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:999px;transition:width 0.3s ease}
.timeline .item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}.timeline .item:last-child{border-bottom:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--teal);margin:7px 0 0 3px;flex:none}
.item strong{font-size:14px}.item .title{font-weight:800}.small{font-size:12px}.notice{background:#fff8e7;border:1px solid #efdfb8;border-radius:17px;padding:14px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.navin{width:min(730px,100%);margin:auto;display:flex;gap:5px}.nav button{flex:1;border:0;background:transparent;border-radius:14px;padding:8px 3px;color:#718586;font-size:11px;cursor:pointer}.nav button.active{background:#e1f2ee;color:var(--teal);font-weight:900}
.admin{background:linear-gradient(145deg,#164b58,#087f83);color:#fff}.admin .kicker{color:#c9eee8}footer{text-align:center;color:#6c8586;font-size:11px;margin:25px 0}
.hidden{display:none!important}.count{font-size:25px;font-weight:900;letter-spacing:.02em}.lock{font-size:48px}
.edit-box{background:#f0faf7;border:1px solid var(--teal2);border-radius:16px;padding:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.edit-box input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}
.pack-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pack-item input[type="checkbox"]{width:20px;height:20px;accent-color:var(--teal)}
@media(max-width:500px){.card{padding:17px}h1{font-size:26px}}
</style>
</head>

function quizIsOpen(){ return demo || Date.now() >= TRIP_START; }

function fmtCountdown(ms){
 if(ms<=0) return '00:00:00';
 const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
 return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

}

function getCurrent(){
 if(demo) return schedule[demoIndex];
 const now = Date.now();

 if (now < TRIP_START) {
   return {
     isBeforeStart: true,
     icon: "🧳",
     title: "Samling & Avfärd",
     start: "03:00",
     end: "04:30",
     place: "Helsingborg → Kastrup",
     detail: "Enbart handbagage gäller! Varmt väder väntar. Taxi avgår kl. 03:00 på torsdag den 10 september."
   };
 }

 const active = schedule.find(a => {
   const st = new Date(a.date+'T'+a.start+':00').getTime();
   const en = new Date(a.date+'T'+a.end+':00').getTime();
   return now >= st && now < en;
 });
 if(active) return active;

 const next = schedule.find(a => now < new Date(a.date+'T'+a.start+':00').getTime());
 return next || schedule[schedule.length-1];
}

function isTimeReached(a){
 if(demo) return true;
 if(a.isBeforeStart) return true;
 const now = Date.now();
 const st = new Date(a.date+'T'+a.start+':00').getTime();
 return now >= st;
}

function displayFields(a){
 if (a.isBeforeStart) return {title: a.title, place: a.place, detail: a.detail};
 if (isTimeReached(a)) return {title: a.title, place: a.place, detail: a.detail};
 return {
   title: a.mask ? (a.mask.title || a.title) : "Hemlig aktivitet",
   place: a.mask ? (a.mask.place || a.place) : "Hemlig plats",
   detail: a.mask ? (a.mask.detail || "Överraskning väntar...") : "Överraskning väntar..."
 };
}

function now(){
 setNav('now');document.getElementById('title').textContent='Just nu';
 const a=getCurrent();
 const d=displayFields(a);
 const timeReached = isTimeReached(a);
 
 let isActive=true;
 if(!demo && !a.isBeforeStart){
  const n=Date.now(), st=new Date(a.date+'T'+a.start+':00').getTime(), en=new Date(a.date+'T'+a.end+':00').getTime();
  isActive=n>=st&&n<en;
 }
 
 const mapBtn = (timeReached && !a.isBeforeStart)
   ? '<button class="btn" onclick="maps()">📍 Visa vägen</button>' 
   : '<button class="btn" disabled title="Kartan visas när aktiviteten startar">📍 Visa vägen</button>';

 document.getElementById('main').innerHTML=`
 <section class="card hero">
   <div class="nowIcon">${a.icon}</div>
   <div class="kicker">${a.isBeforeStart ? 'Inför resan' : (isActive?'Pågår nu':'Nästa aktivitet')}</div>
   <div class="big">${esc(d.title)}</div>
   <div class="time">⏰ ${a.start}${a.end ? '–'+a.end : ''}</div>
   <div class="meta" style="color:#e0f7f3">📍 ${esc(d.place)}</div>
   <p style="margin-top:12px;line-height:1.4;">${esc(d.detail)}</p>
   <div class="row" style="margin-top:15px">${mapBtn}</div>
 </section>
 <section class="card">
   <div class="kicker">Överraskningen</div>
   <div class="big">🔒 Nästa aktivitet är dold</div>
   <p class="muted">När klockan nått nästa starttid byts innehållet automatiskt.</p>
 </section>
 ${demo?'<section class="card"><div class="kicker">Arrangörstest</div><button class="btn dark" onclick="nextDemo()">⏭️ Nästa aktivitet i demoläge</button></section>':''}`;
 footer();
}

function maps(){
 const a=getCurrent(); 
 if(!isTimeReached(a)) return;
 window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.place+' Malta'),'_blank');
}

function quizPage(){
 setNav('quiz');document.getElementById('title').textContent='Gissa resmålet';
 if(revealed){
   document.getElementById('main').innerHTML='<section class="card hero"><div class="kicker">Quiz klart</div><div class="big">🎉 Ni klarade quizet!</div><p>🇲🇹 Vi ska till Malta!</p><button class="btn" onclick="go(\'home\')">Till resan →</button></section>';
   footer();return;
 }
 if(!quizIsOpen()){
  document.getElementById('main').innerHTML='<section class="card" style="text-align:center"><div class="lock">🔒</div><div class="kicker">Quizet är låst</div><div class="big" style="margin-top:10px">Öppnar kl. 03:00 på torsdag</div><p class="muted">När taxin rullar från Helsingborg låses ledtrådarna upp!</p><div class="count" id="countdown" style="margin-top:15px;color:var(--teal)">'+fmtCountdown(TRIP_START-Date.now())+'</div></section>';
  footer();return;
 }
 const q=quiz[Math.min(quizStep,quiz.length-1)];
 document.getElementById('main').innerHTML='<section class="card"><div class="kicker">'+q.kicker+'</div><div class="progress"><span style="width:'+((quizStep+1)/quiz.length*100)+'%"></span></div><div class="big">'+q.q+'</div>'+q.opts.map((o,i)=>'<button class="quizOpt" onclick="answer('+i+')">'+esc(o)+'</button>').join('')+'</section><section class="card notice">'+q.tip+'</section>';
 footer();
}

function answer(i){
 const q=quiz[Math.min(quizStep,quiz.length-1)];
 if(i===q.answer){
   quizStep++;
   localStorage.setItem('quizStep',quizStep);
   if(quizStep>=quiz.length){
     revealed=true;
     localStorage.setItem('revealed','yes');
     alert('🎉 RÄTT! 🇲🇹 Resmålet är MALTA!');
   } else {
     alert('Rätt svar! Snyggt jobbat, vidare till nästa fråga!');
   }
 } else {
   alert('Fel svar! Försök igen 😉');
 }
 go('quiz');
}

function info(){
 setNav('info');document.getElementById('title').textContent='Praktiskt';
 const flygInfo=revealed?'Swiss Air · CPH ↔ Malta':'Avslöjas i quizet 🤫';
 const hotellInfo=revealed?'Plaza Regency · Sliema':'Avslöjas i quizet 🤫';
 
 const linksSection = revealed ? `
   <section class="card">
     <div class="kicker">Länkar</div>
     <div class="row" style="margin-top:10px;">
       <a href="https://www.plazahotelsmalta.com" target="_blank" class="btn alt">🏨 Hotellets hemsida</a>
     </div>
   </section>
 ` : '';

 const packHtml = packingList.map((item, idx) => `
   <div class="pack-item">
     <input type="checkbox" id="chk_${idx}" ${item.checked ? 'checked' : ''} onchange="togglePack(${idx})">
     <label for="chk_${idx}">${esc(item.text)}</label>
   </div>
 `).join('');

 document.getElementById('main').innerHTML=`
 <section class="card">
   <div class="kicker">Resan</div>
   <div class="grid">
     <div class="tile"><b>✈️ Flyg</b><span class="small muted">${flygInfo}</span></div>
     <div class="tile"><b>🏨 Hotell</b><span class="small muted">${hotellInfo}</span></div>
     <div class="tile"><b>👯 Grupp</b><span class="small muted">10 tjejer · 2 arrangörer</span></div>
     <div class="tile"><b>🧳 Packning</b><span class="small muted">Enbart handbagage!</span></div>
   </div>
 </section>
 ${linksSection}
 <section class="card">
   <div class="kicker">Packlista för Tjejresan</div>
   <p class="muted" style="font-size:13px;">Bocka av vad du packat ner:</p>
   <div>${packHtml}</div>
   <div style="margin-top:15px;display:flex;gap:5px;">
     <input id="new_pack" placeholder="Lägg till eget plagg/sak..." style="flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;">
     <button class="btn sm" onclick="addPackItem()">+ Lägg till</button>
   </div>
 </section>
 <section class="card">
   <div class="kicker">Viktig information</div>
   <p class="muted">Samling och avfärd sker med Taxi från Helsingborg kl 03:00 natten mot torsdag den 10 september.</p>
 </section>`;
 footer();
}

function togglePack(idx){
 packingList[idx].checked = !packingList[idx].checked;
 localStorage.setItem('customPacking', JSON.stringify(packingList));
}

function addPackItem(){
 const input = document.getElementById('new_pack');
 if(input && input.value.trim()){
   packingList.push({ id: Date.now(), text: input.value.trim(), checked: false });
   localStorage.setItem('customPacking', JSON.stringify(packingList));
   info();
 }
}

function adminLogin(){
 if(admin){go('admin');return}
 const p=prompt('Arrangörslösenord');
 if(p==='Malta2026!'){
   admin=true;
   localStorage.setItem('admin','yes');
   go('admin');
 } else {
   alert('Fel lösenord.');
 }
}

function adminPage(){
 setNav('admin');document.getElementById('title').textContent='Arrangörsläge';
 const list=schedule.map((a,i)=>{
   if(editingIndex===i){
     return `<div class="edit-box">
       <input id="e_title" value="${esc(a.title)}" placeholder="Titel">
       <div style="display:flex;gap:5px;">
         <input id="e_start" value="${esc(a.start)}" placeholder="Start (HH:MM)" style="width:50%">
         <input id="e_end" value="${esc(a.end)}" placeholder="Slut (HH:MM)" style="width:50%">
       </div>
       <input id="e_place" value="${esc(a.place)}" placeholder="Plats">
       <input id="e_detail" value="${esc(a.detail)}" placeholder="Detaljer">
       <div style="display:flex;gap:5px;margin-top:5px;">
         <button class="btn sm" onclick="saveItem(${i})">Spara</button>
         <button class="btn sm alt" onclick="editingIndex=-1;go('admin')">Avbryt</button>
       </div>
     </div>`;
   }
   return `<div class="item">
     <div class="dot"></div>
     <div style="flex:1">
       <strong>${a.date} · ${a.start}–${a.end}</strong>
       <div class="title">${a.icon} ${esc(a.title)}</div>
       <div class="small muted">📍 ${esc(a.place)} · ${esc(a.detail)}</div>
     </div>
     <button class="btn sm alt" onclick="editingIndex=${i};go('admin')">✏️</button>
   </div>`;
 }).join('');

 document.getElementById('main').innerHTML=`<section class="card admin">
   <div class="kicker">🔐 Endast arrangörer</div>
   <div class="big">Hela resan</div>
   <p>Ändringar ni gör här sparas direkt i er mobil.</p>
   <div class="row">
     <button class="btn" onclick="reveal()">🔓 Avslöja Malta</button>
     <button class="btn alt" onclick="demo=true;localStorage.setItem('demo','yes');go('now')">🧪 Testa tidsflödet</button>
     <button class="btn alt" onclick="exportCode()">📋 Kopiera ny kod till GitHub</button>
     <button class="btn alt" onclick="resetApp()">🔄 Återställ allt</button>
     <button class="btn alt" onclick="admin=false;localStorage.removeItem('admin');go('home')">Logga ut</button>
   </div>
 </section>
 <section class="card">
   <div class="kicker">Program (Klicka ✏️ för att ändra)</div>
   <div class="timeline">${list}</div>
 </section>`;
 footer();
}

function saveItem(i){
 schedule[i].title = document.getElementById('e_title').value;
 schedule[i].start = document.getElementById('e_start').value;
 schedule[i].end = document.getElementById('e_end').value;
 schedule[i].place = document.getElementById('e_place').value;
 schedule[i].detail = document.getElementById('e_detail').value;
 localStorage.setItem('customSchedule', JSON.stringify(schedule));
 editingIndex = -1;
 go('admin');
}

function exportCode(){
 const html = document.documentElement.outerHTML;
 navigator.clipboard.writeText('<!doctype html>\n' + html);
 alert('Hela sidans källkod är kopierad! Du kan klistra in den i index.html på GitHub direkt från mobilen om ni vill att ändringen ska gälla för ALLA.');
}

function reveal(){
 revealed=true;
 localStorage.setItem('revealed','yes');
 alert('🇲🇹 Malta är nu avslöjat!');
 go('home');
}

function resetApp(){
 localStorage.clear();
 schedule = defaultSchedule;
 packingList = defaultPacking;
 revealed=false;
 admin=false;
 demo=false;
 demoIndex=0;
 quizStep=0;
 alert('Appen har återställts till ursprungsläget!');
 go('home');
}

function nextDemo(){
 demoIndex=(demoIndex+1)%schedule.length;
 localStorage.setItem('demoIndex',demoIndex);
 go('now');
}

function footer(){
 document.getElementById('main').insertAdjacentHTML('beforeend','<footer>Tjejresan 2026'+(revealed?' · Malta 💚':' · 💚')+'</footer>');
}

home();

setInterval(()=>{ if(currentPage==='now') now(); },15000);
setInterval(()=>{
 if(currentPage==='quiz' && !revealed){
  if(!quizIsOpen()){
   const el=document.getElementById('countdown');
   if(el) el.textContent=fmtCountdown(TRIP_START-Date.now());
   if(quizIsOpen()) quizPage(); 
  }
 }
},1000);
</script>
</body>
</html>
